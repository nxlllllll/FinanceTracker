<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>{{TITLE}} — Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        :root{
            --bg:#080a0f;--bg1:#0d1017;--bg2:#111620;--bg3:#161d2c;
            --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.10);
            --text:#e8ecf4;--text2:#8b93a8;--text3:#4d5568;
            --cyan:#38bdf8;--cyan-dim:rgba(56,189,248,.12);
            --green:#4ade80;--green-dim:rgba(74,222,128,.12);
            --red:#f87171;--red-dim:rgba(248,113,113,.12);
            --amber:#fbbf24;--amber-dim:rgba(251,191,36,.12);
            --purple:#a78bfa;--purple-dim:rgba(167,139,250,.12);
            --mono:'JetBrains Mono',monospace;--sans:'Space Grotesk',sans-serif;
            --r:8px;--r2:12px;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}

        /* HEADER */
        .header{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 32px;position:sticky;top:0;z-index:100;flex-shrink:0}
        .header-top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;gap:16px;flex-wrap:wrap}
        .logo{display:flex;align-items:center;gap:10px}
        .logo-icon{width:26px;height:26px;background:var(--cyan);border-radius:6px;display:flex;align-items:center;justify-content:center}
        .logo-icon svg{width:14px;height:14px}
        .logo-text{font-size:14px;font-weight:600;letter-spacing:-.3px}
        .logo-sub{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:1px}
        .header-kpis{display:flex;gap:4px;flex-wrap:wrap}
        .kpi-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);font-size:11px}
        .kpi-chip .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
        .kpi-chip .val{font-family:var(--mono);font-weight:600;font-size:12px}
        .kpi-chip .lbl{color:var(--text2);font-size:10px}
        .kpi-chip.ok .val{color:var(--green)}.kpi-chip.ok .dot{background:var(--green)}
        .kpi-chip.fail .val{color:var(--red)}.kpi-chip.fail .dot{background:var(--red)}
        .kpi-chip.info .val{color:var(--cyan)}.kpi-chip.info .dot{background:var(--cyan)}
        .kpi-chip.warn .val{color:var(--amber)}.kpi-chip.warn .dot{background:var(--amber)}
        .tab-nav{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -32px;padding:0 32px}
        .tab-nav::-webkit-scrollbar{display:none}
        .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:7px 14px 9px;font-size:12px;font-weight:500;font-family:var(--sans);color:var(--text3);cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;display:flex;align-items:center;gap:5px}
        .tab-btn:hover{color:var(--text2)}
        .tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}
        .tab-count{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:3px;background:var(--bg3);color:var(--text2)}
        .tab-btn.active .tab-count{background:var(--cyan-dim);color:var(--cyan)}
        .tab-err{width:5px;height:5px;background:var(--red);border-radius:50%}

        /* MAIN */
        main{flex:1;padding:24px 32px 48px;max-width:1600px;width:100%;margin:0 auto}
        .page{display:none}.page.active{display:block}

        /* PAGE HEADER */
        .page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
        .page-title{font-size:20px;font-weight:700;letter-spacing:-.5px}
        .page-meta{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--mono)}
        .badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
        .badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;font-family:var(--mono);letter-spacing:.3px}
        .badge-cyan{background:var(--cyan-dim);color:var(--cyan);border:1px solid rgba(56,189,248,.2)}
        .badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(74,222,128,.2)}
        .badge-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(248,113,113,.2)}
        .badge-amber{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(251,191,36,.2)}

        /* STAT CARDS */
        .stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:20px}
        .stat-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px;position:relative;overflow:hidden;cursor:default}
        .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
        .stat-card.cyan::before{background:var(--cyan)}.stat-card.green::before{background:var(--green)}
        .stat-card.red::before{background:var(--red)}.stat-card.amber::before{background:var(--amber)}
        .stat-card.purple::before{background:var(--purple)}
        .stat-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
        .stat-val{font-size:18px;font-weight:700;font-family:var(--mono);line-height:1}
        .stat-val.cyan{color:var(--cyan)}.stat-val.green{color:var(--green)}
        .stat-val.red{color:var(--red)}.stat-val.amber{color:var(--amber)}.stat-val.purple{color:var(--purple)}
        .stat-sub{font-size:10px;color:var(--text3);margin-top:3px;font-family:var(--mono)}

        /* CHARTS */
        .chart-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px}
        .chart-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:2px}
        .chart-subtitle{font-size:11px;color:var(--text3);margin-bottom:12px}
        /* Legend с кликабельными фильтрами */
        .chart-legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
        .legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2);cursor:pointer;padding:3px 7px;border-radius:4px;border:1px solid transparent;transition:opacity .15s,border-color .15s;user-select:none}
        .legend-item:hover{border-color:var(--border2)}
        .legend-item.hidden{opacity:.3}
        .legend-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0}
        .chart-wrap{position:relative}

        /* HEATMAP */
        .heatmap-wrap{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px 18px;margin-bottom:20px;overflow-x:auto}
        .heatmap-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:12px}
        .heatmap-table{border-collapse:collapse;width:100%;min-width:400px}
        .heatmap-table th{font-size:9px;color:var(--text3);font-family:var(--mono);font-weight:500;padding:4px 8px;text-align:center;border-bottom:1px solid var(--border)}
        .heatmap-table th:first-child{text-align:right;width:150px}
        .heatmap-cell-wrap{padding:3px}
        .heatmap-cell{border-radius:5px;height:28px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:500;cursor:default;transition:filter .15s;min-width:70px}
        .heatmap-cell:hover{filter:brightness(1.15)}
        .heatmap-method{font-size:11px;color:var(--text2);text-align:right;padding:3px 10px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}

        /* SEC DIVIDER */
        .sec-divider{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);display:flex;align-items:center;gap:10px;margin:20px 0 12px}
        .sec-divider::after{content:'';flex:1;height:1px;background:var(--border)}

        /* TABLE */
        .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r2);margin-bottom:20px}
        table{width:100%;border-collapse:collapse}
        thead tr{background:var(--bg2)}
        th{padding:7px 12px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text3);text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
        th:hover{color:var(--text2)}
        th.sort-asc::after{content:' ↑'}
        th.sort-desc::after{content:' ↓'}
        th:first-child,th:nth-child(2){text-align:left}
        td{padding:7px 12px;font-family:var(--mono);font-size:11px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;color:var(--text2)}
        td:first-child{text-align:left;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--text)}
        td:nth-child(2){text-align:left;color:var(--text3);font-size:10px}
        tr:last-child td{border-bottom:none}
        /* Зебра-окраска строк */
        tbody tr.data-row:nth-child(4n+1) td,
        tbody tr.data-row:nth-child(4n+2) td { background:rgba(255,255,255,.015); }
        tbody tr.data-row:hover td{background:rgba(255,255,255,.04)!important}
        /* Overview таблицы — зебра без группировки */
        .overview-table tbody tr:nth-child(odd) td { background:rgba(255,255,255,.015); }
        .overview-table tbody tr:hover td { background:rgba(255,255,255,.04)!important; }
        .overview-table th { text-align:right }
        .overview-table th:first-child,
        .overview-table th:nth-child(2) { text-align:left }
        .overview-table td:nth-child(n+3) { padding:7px 8px }
        .overview-table th:last-child { text-align:left }
        .overview-table td:last-child { text-align:left }
        .cell-fast{color:var(--green)!important;font-weight:500}
        .cell-medium{color:var(--amber)!important}
        .cell-slow{color:var(--red)!important}
        .cell-na{color:var(--text3)!important;font-style:italic}
        .inline-bar{display:inline-block;height:3px;border-radius:2px;margin-left:5px;vertical-align:middle;opacity:.55}

        /* GROUP ROW */
        .group-row td{background:var(--bg2)!important;cursor:pointer;border-bottom:1px solid var(--border2)!important}
        .group-row:hover td{background:var(--bg3)!important}
        .group-toggle{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-weight:600;font-size:12px;color:var(--text);padding-left:14px}
        .group-toggle .arrow{display:inline-block;transition:transform .2s;color:var(--text3);font-size:10px}
        .group-row.open .arrow{transform:rotate(90deg)}
        .group-badge{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:3px;background:var(--bg3);color:var(--text2)}
        .group-meta{font-family:var(--mono);font-size:10px;color:var(--text3);text-align:right}

        /* EXPANDED DETAIL */
        .detail-row td{padding:0;background:var(--bg)!important;border-bottom:1px solid var(--border2)!important}
        .detail-row{display:none}
        .detail-row.open{display:table-row}
        .detail-inner{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
        @media(max-width:1200px){.detail-inner{grid-template-columns:1fr 1fr}}
        @media(max-width:800px){.detail-inner{grid-template-columns:1fr}}
        .detail-section{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:14px 16px}
        .detail-section-title{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--text3);margin-bottom:10px}
        .detail-chart-wrap{position:relative;height:160px}
        .degradation-table{width:100%;border-collapse:collapse}
        .degradation-table td{padding:4px 6px;font-family:var(--mono);font-size:10px;color:var(--text2);border-bottom:1px solid var(--border)}
        .degradation-table tr:last-child td{border-bottom:none}
        .degradation-table td:first-child{color:var(--text);font-weight:500}
        .deg-ratio{font-weight:600}
        .deg-ratio.bad{color:var(--red)}.deg-ratio.ok{color:var(--green)}.deg-ratio.mid{color:var(--amber)}
        .stat-mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
        .stat-mini{background:var(--bg2);border-radius:6px;padding:8px 10px}
        .stat-mini-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
        .stat-mini-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--text)}
        .stat-mini-val.good{color:var(--green)}.stat-mini-val.bad{color:var(--red)}.stat-mini-val.mid{color:var(--amber)}

        /* ANOMALY */
        .anomaly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;margin-bottom:20px}
        .anomaly-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;display:flex;gap:10px}
        .anomaly-icon{width:26px;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px}
        .anomaly-icon.warn{background:var(--amber-dim);color:var(--amber)}
        .anomaly-icon.error{background:var(--red-dim);color:var(--red)}
        .anomaly-icon.info{background:var(--cyan-dim);color:var(--cyan)}
        .anomaly-title{font-size:11px;font-weight:600;margin-bottom:2px}
        .anomaly-detail{font-size:10px;color:var(--text2);font-family:var(--mono);line-height:1.5}

        /* MEMORY */
        .mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:20px}
        .mem-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:12px 14px}
        .mem-method{font-size:10px;font-weight:500;color:var(--text2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .mem-alloc{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--cyan);margin-bottom:4px}
        .mem-gc{font-family:var(--mono);font-size:10px;color:var(--text3);display:flex;gap:6px;flex-wrap:wrap}
        .mem-gc-item{display:flex;align-items:center;gap:3px}
        .g0d{width:4px;height:4px;border-radius:50%;background:var(--cyan)}
        .g1d{width:4px;height:4px;border-radius:50%;background:var(--amber)}
        .g2d{width:4px;height:4px;border-radius:50%;background:var(--red)}

        footer{text-align:center;padding:18px;font-size:10px;color:var(--text3);border-top:1px solid var(--border);font-family:var(--mono);letter-spacing:.3px}
    </style>
</head>
<body>
<header class="header">
    <div class="header-top">
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 14 14" fill="none">
                    <rect x="0" y="6" width="3" height="8" rx="1" fill="#080a0f"/>
                    <rect x="4" y="3" width="3" height="11" rx="1" fill="#080a0f"/>
                    <rect x="8" y="0" width="3" height="14" rx="1" fill="#080a0f"/>
                    <rect x="12" y="4" width="2" height="10" rx="1" fill="#080a0f"/>
                </svg>
            </div>
            <div>
                <div class="logo-text">{{TITLE}}</div>
                <div class="logo-sub">{{RUN_META}}</div>
            </div>
        </div>
        <div class="header-kpis">{{KPI_CHIPS}}</div>
    </div>
    <nav class="tab-nav">{{TAB_BUTTONS}}</nav>
</header>

<main>{{SECTIONS}}</main>

<footer>AnalyticsHtmlExporter · BenchmarkDotNet · FinanceTracker · {{RUN_DATE}}</footer>

<script>
    // ── Tab switching ──────────────────────────────────────────────────────────
    function showTab(id){
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('page-'+id).classList.add('active');
      document.getElementById('tab-'+id).classList.add('active');
    }
    // Overview активен по умолчанию через class="active" из C#
    
    // ── Group row toggle ───────────────────────────────────────────────────────
    function toggleGroup(id){
      const grp=document.getElementById('grp-'+id);
      const det=document.getElementById('det-'+id);
      if(!grp||!det)return;
      const open=det.classList.toggle('open');
      grp.classList.toggle('open',open);
      // Запускаем inline скрипты внутри detail при первом открытии
      if(open&&!det._init){
        det._init=true;
        det.querySelectorAll('script').forEach(s=>{
          const fn=new Function(s.textContent);
          try{fn();}catch(e){console.warn('chart init',e);}
        });
      }
    }
    
    // ── Table sort ─────────────────────────────────────────────────────────────
    function sortTable(tableId,col,isNum){
      const tbl=document.getElementById(tableId);
      if(!tbl)return;
      const ths=tbl.querySelectorAll('thead th');
      const tbody=tbl.querySelector('tbody');
      const groupOrder=[];
      const groups={};
      tbody.querySelectorAll('tr').forEach(r=>{
        const g=r.dataset.group;
        if(!g)return;
        if(!groups[g]){groups[g]={grp:null,det:null,rows:[]};groupOrder.push(g);}
        if(r.classList.contains('group-row'))groups[g].grp=r;
        else if(r.classList.contains('detail-row'))groups[g].det=r;
        else if(r.classList.contains('data-row'))groups[g].rows.push(r);
      });
      let asc=ths[col].classList.contains('sort-desc')||!ths[col].classList.contains('sort-asc');
      ths.forEach(th=>th.classList.remove('sort-asc','sort-desc'));
      ths[col].classList.add(asc?'sort-asc':'sort-desc');
      groupOrder.forEach(g=>{
        groups[g].rows.sort((a,b)=>{
          const av=a.cells[col]?.dataset.val??a.cells[col]?.textContent??'';
          const bv=b.cells[col]?.dataset.val??b.cells[col]?.textContent??'';
          if(isNum){const d=(parseFloat(av)||0)-(parseFloat(bv)||0);return asc?d:-d;}
          return asc?av.localeCompare(bv):bv.localeCompare(av);
        });
      });
      groupOrder.sort((ga,gb)=>{
        const ra=groups[ga].rows[0],rb=groups[gb].rows[0];
        if(!ra||!rb)return 0;
        const av=ra.cells[col]?.dataset.val??ra.cells[col]?.textContent??'';
        const bv=rb.cells[col]?.dataset.val??rb.cells[col]?.textContent??'';
        if(isNum){const d=(parseFloat(av)||0)-(parseFloat(bv)||0);return asc?d:-d;}
        return asc?av.localeCompare(bv):bv.localeCompare(av);
      });
      groupOrder.forEach(g=>{
        const{grp,det,rows}=groups[g];
        if(grp)tbody.appendChild(grp);
        if(det)tbody.appendChild(det);
        rows.forEach(r=>tbody.appendChild(r));
      });
    }
    
    // ── Chart legend filter ────────────────────────────────────────────────────
    // Вызывается кликом на legend-item: toggles датасет в Chart.js
    function toggleDataset(legendId, datasetIndex){
      const item=document.getElementById(legendId);
      if(!item)return;
      const canvasId=item.closest('.chart-card')?.querySelector('canvas')?.id;
      if(!canvasId)return;
      const chart=Chart.getChart(canvasId);
      if(!chart)return;
      const meta=chart.getDatasetMeta(datasetIndex);
      meta.hidden=!meta.hidden;
      item.classList.toggle('hidden',meta.hidden);
      chart.update();
    }
</script>
</body>
</html>
