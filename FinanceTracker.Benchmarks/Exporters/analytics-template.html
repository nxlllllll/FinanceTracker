<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>{{TITLE}} — Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>

            </div>
            <div>
                <div class="logo-text">{{TITLE}}</div>
                <div class="logo-sub">{{RUN_META}}</div>
            </div>
        </div>
        <div class="header-kpis" id="kpi-chips"></div>
    </div>
    <nav class="tab-nav" id="tab-nav"></nav>
</header>

<main id="main-content"></main>

<footer>AnalyticsHtmlExporter · BenchmarkDotNet · FinanceTracker · {{RUN_DATE}}</footer>
