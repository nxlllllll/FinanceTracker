global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'finance-tracker-workers'
    static_configs:
      - targets:
          - 'worker-outbox:5100'
          - 'worker-account-projection:5101'
          - 'worker-recurring-transaction:5102'
          - 'worker-recurring-transaction-projection:5103'
          - 'worker-dead-letter-monitor:5104'
          - 'worker-transfer-projection:5105'
          - 'worker-currency-rate:5106'
          - 'worker-balance-adjustment:5107'
          - 'worker-cleanup:5108'
          - 'worker-domain-event-outbox:5109'