global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.mail.ru:587'
  smtp_from: 'alerts@example.com'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password: 'CHANGE_ME_APP_PASSWORD'
  smtp_require_tls: true

route:
  receiver: default
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    telegram_configs:
      - bot_token: 'CHANGE_ME_BOT_TOKEN'
        chat_id: 0
        message: |-
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
        send_resolved: true
    email_configs:
      - to: 'you@example.com'
        send_resolved: true

  - name: critical
    telegram_configs:
      - bot_token: 'CHANGE_ME_BOT_TOKEN'
        chat_id: 0
        message: |-
          🚨 {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
        send_resolved: true
    email_configs:
      - to: 'you@example.com'
        send_resolved: true
