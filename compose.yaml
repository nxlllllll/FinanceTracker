        condition: service_completed_successfully
        
  migrator:
    build:
      context: .
      dockerfile: FinanceTracker.Migrator/Dockerfile
    environment:
      ConnectionStrings__FinanceTrackerContext: ${DB_CONNECTION_STRING}
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
    
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - grafana

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: