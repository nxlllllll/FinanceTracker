x-redis-env: &redis-env
  Redis__InstanceName: "ft:"

x-rabbitmq-env: &rabbitmq-env
  RabbitMQ__Port: "5672"

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    profiles: ["ops"]
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      METRICS_DIR: /metrics
      BACKUP_DIR: /backups
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      BACKUP_CRON: "${BACKUP_CRON:-30 3 * * *}"
    volumes:
      - ./scripts/backup:/scripts:ro
      - metrics_textfile:/metrics
      - backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        echo "$${BACKUP_CRON} /bin/sh /scripts/pg-backup.sh >> /proc/1/fd/1 2>&1" > /etc/crontabs/root
        echo "[backup] Scheduled: $${BACKUP_CRON}"
        exec crond -f -l 8
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backrest:
    profiles: ["ops"]
    image: garethgeorge/backrest:latest
    environment:
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
    volumes:
      - backrest_data:/data
      - backrest_config:/config
      - backrest_cache:/cache
      - backups:/userdata/postgres:ro
      - rabbitmq_data:/userdata/rabbitmq:ro
    ports:
      - "127.0.0.1:9898:9898"
    depends_on:
      backup:
        condition: service_started
    restart: unless-stopped

  dozzle:
    profiles: ["ops"]
    image: amir20/dozzle:latest
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8888:8080"
    restart: unless-stopped

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    profiles: ["observability"]
    image: prom/node-exporter:v1.8.2
    command:
      - '--collector.textfile.directory=/metrics'
      - '--path.rootfs=/host'
    volumes:
      - metrics_textfile:/metrics:ro
    ports:
      - "127.0.0.1:9100:9100"
    restart: unless-stopped

  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8081:8080"
    privileged: true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.0-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ENABLED_PLUGINS_FILE: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    command: >
      sh -c "echo '[rabbitmq_management,rabbitmq_prometheus].' > /etc/rabbitmq/enabled_plugins && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: FinanceTracker.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: [*redis-env, *rabbitmq-env, *otel-env]
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinanceTrackerContext: ${DB_CONNECTION_STRING}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Redis__ConnectionString: redis:6379
      Jwt__Secret: ${JWT_SECRET}
      OpenApi__Expose: "${OPENAPI_EXPOSE:-false}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker-outbox:
    profiles: ["app"]
    build:
      context: .
      dockerfile: FinanceTracker.Worker.Outbox/Dockerfile
    ports:
      - "5000:5000"
    environment:
      <<: [*redis-env, *rabbitmq-env, *otel-env]
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__FinanceTrackerContext: ${DB_CONNECTION_STRING}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Redis__ConnectionString: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrator:
