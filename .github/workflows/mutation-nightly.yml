name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-nightly
  cancel-in-progress: true

jobs:
  mutation-full:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        config:
          - stryker-config.core.json
          - stryker-config.application.json
          - stryker-config.infrastructure-cache.json
          - stryker-config.infrastructure-eventstore.json
          - stryker-config.infrastructure-services.json
          - stryker-config.infrastructure-repositories.json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore

      - name: Run full mutation testing
        working-directory: FinanceTracker.Tests
        run: >
          dotnet tool run dotnet-stryker
          -f ${{ matrix.config }}
          --concurrency 4

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ matrix.config }}
          path: FinanceTracker.Tests/StrykerOutput/**/reports/*
          retention-days: 30
