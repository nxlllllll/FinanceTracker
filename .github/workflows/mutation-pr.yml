name: Mutation Testing (PR diff)

on:
  pull_request:
    branches: [develop, main]

jobs:
  mutation-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Stryker
        run: dotnet tool install -g dotnet-stryker

      - name: Restore
        run: dotnet restore

      - name: Run mutation testing (diff only)
        working-directory: FinanceTracker.Tests
        run: |
          for proj in Core Application Infrastructure; do
            dotnet stryker \
              --project "FinanceTracker.$proj.csproj" \
              --config-file-path stryker-config.pr-diff.json \
              --since:origin/${{ github.base_ref }}
          done

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-reports-pr-${{ github.event.pull_request.number }}
          path: FinanceTracker.Tests/StrykerOutput/**/reports/*.json
