name: Docker build & push

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}/financetracker

jobs:
  matrix-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every Dockerfile is covered by the build matrix
        run: |
          # The matrix duplicates the list of projects, and a missing entry is not a build error —
          # it is an image that silently never gets built or published.
          missing=0
          for dockerfile in $(find . -name Dockerfile -not -path './.git/*'); do
            project=$(dirname "$dockerfile" | sed 's|^\./||')
            if ! grep -q "path: $project *}" .github/workflows/docker-build.yml; then
              echo "::error::$project has a Dockerfile but no entry in the build matrix"
              missing=1
            fi
          done
          exit $missing

  build:
    needs: matrix-completeness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: migrator, path: FinanceTracker.Migrator }
          - { name: worker-outbox, path: FinanceTracker.Worker.Outbox }
          - { name: worker-account-projection, path: FinanceTracker.Worker.AccountProjection }
          - { name: worker-balance-adjustment, path: FinanceTracker.Worker.BalanceAdjustment }
          - { name: worker-transfer-projection, path: FinanceTracker.Worker.TransferProjection }
          - { name: worker-recurring-transaction, path: FinanceTracker.Worker.RecurringTransaction }
          - { name: worker-recurring-projection, path: FinanceTracker.Worker.RecurringTransactionProjection }
          - { name: worker-currency-rate, path: FinanceTracker.Worker.CurrencyRate }
          - { name: worker-cleanup, path: FinanceTracker.Worker.Cleanup }
          - { name: worker-dead-letter-monitor, path: FinanceTracker.Worker.DeadLetterMonitor }
          - { name: worker-permission-projection, path: FinanceTracker.Worker.PermissionProjection }
          - { name: worker-user-role-projection, path: FinanceTracker.Worker.UserRoleProjection }
          - { name: cli, path: FinanceTracker.Cli }
          - { name: api, path: FinanceTracker.Api }

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  docker-build-status:
    needs: [matrix-completeness, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any matrix build failed
        run: ${{ (needs.matrix-completeness.result == 'success' && needs.build.result == 'success') && 'true' || 'false' }}
