groups:
  - name: finance-tracker-jobs
    rules:
      - alert: JobExecutionFailed
        expr: increase(job_execution_failed_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} threw an unhandled exception"
          description: "{{ $labels.job }} failed at least once in the last 10 minutes. Check its logs for the exception wrapped in JobExecutionException."

  - name: finance-tracker-messaging
    rules:
      - alert: OutboxMessageDeadLettered
        expr: increase(outbox_failed_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "An outbox message was moved to dead letter"
          description: "outbox_failed_total increased in the last 15 minutes — a message the system was supposed to publish at-least-once did not make it out. Investigate OutboxPublisherJob and the affected AggregateId in outbox_messages."

      - alert: UnresolvableEventBacklogNotDraining
        expr: unresolvable_events_pending > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Escalated events have been awaiting manual resolution for 30+ minutes"
          description: "unresolvable_events_pending has been above zero for at least 30 minutes. These are rows in the unresolvable_events table with resolved_at IS NULL — not RabbitMQ dead letter queues. Something was escalated for a human and no human has closed it. DeadLetterMonitoringJob logs each one as it appears; find them there or query the table directly."

      - alert: UnresolvableEventBacklogStale
        expr: unresolvable_events_pending > 0
        for: 2h
        labels:
          severity: critical
        annotations:
          summary: "Escalated events have been unresolved for 2+ hours"
          description: "Events escalated for manual resolution have gone untouched for over two hours. Every row here is something the system could not fix on its own — a failed transfer compensation, a rejected rate correction, a recurring occurrence that never became a transaction. This needs someone acting now, not just watching. Resolve by fixing the underlying record and setting resolved_at."

  - name: finance-tracker-transfers
    rules:
      - alert: TransferCreditStuckPastCompensation
        expr: transfer_credit_pending > 0
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: "A transfer's credit side has been pending past the auto-compensation window"
          description: "transfer_credit_pending has been above zero for 45+ minutes, well past the 30-minute auto-compensation threshold. Check whether TransferCreditLagJob is running."

      - alert: TransferEscalatedToManualResolution
        expr: increase(transfers_failed_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A transfer requires manual resolution"
          description: "transfers_failed_total increased in the last hour — a transfer could not be completed or compensated automatically and needs manual review in unresolvable_events."

  - name: finance-tracker-recurring-transactions
    rules:
      - alert: RecurringTransactionEscalated
        expr: increase(recurring_transactions_failed_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A recurring transaction occurrence could not be created"
          description: "recurring_transactions_failed_total increased in the last hour — an occurrence was escalated to unresolvable_events instead of becoming a transaction."

  - name: finance-tracker-currency-rates
    rules:
      - alert: CurrencyRateFetchRepeatedlyFailing
        expr: increase(currency_rates_fetch_failed_total[1h]) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The exchange-rate API has failed repeatedly"
          description: "currency_rates_fetch_failed_total increased by more than 2 in the last hour. New rates aren't landing, so cached 'latest' rates (see CachedCurrencyRateReadRepository) will keep serving increasingly stale values until this recovers."

  - name: finance-tracker-rate-adjustments
    rules:
      - alert: RateAdjustmentUnresolvable
        expr: increase(balance_adjustment_unresolvable_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A rate correction was rejected — a recorded balance is knowingly wrong"
          description: "BalanceAdjustmentJob got the real rate but could not apply the correction ({{ $labels.source_type }}). Archiving is no longer a likely cause: ArchiveAccountHandler refuses to archive an account that still has a pending rate or an open transfer obligation, so look for a domain rule that rejected the adjustment for another reason. The affected balance is still computed from the placeholder rate and will not fix itself — the operation is now terminal (Unresolvable) and will never be retried. Investigate unresolvable_events, type RateAdjustmentFailed."

      - alert: RateApproximationSpike
        expr: increase(balance_adjustment_approximated_total[24h]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Unusual number of operations closed at an approximate rate"
          description: "{{ $value }} operations ({{ $labels.source_type }}) were closed as Approximated in the last 24h — the exact rate for their date never arrived within the grace period. A trickle is expected and harmless: these are backdated entries, and rate history is never back-filled (only /latest/ is fetched). A spike usually means something else — CurrencyRateJob is not delivering a currency pair users actually transact in. Cross-check currency_rates_fetch_failed_total and whether the pair is in the active currency list."

      - alert: PendingRateBacklogGrowing
        expr: increase(balance_adjustment_resolved_total[24h]) == 0 and increase(balance_adjustment_approximated_total[24h]) == 0 and increase(balance_adjustment_unresolvable_total[24h]) == 0 and increase(job_execution_failed_total{job="BalanceAdjustmentJob"}[24h]) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "BalanceAdjustmentJob has settled nothing in 24 hours"
          description: "The job is not throwing, yet nothing has left the pending-rate queue in a day. Either there is genuinely nothing to settle (fine — but verify against a count of rows where rate_status = 'pending'), or the queue is silently not being drained: a broken query filter, a cron that never fires, or a worker that is up but idle. This is the failure mode the old boolean flag hid for months, so it now has its own alert rather than relying on someone noticing an absence."

  - name: finance-tracker-platform
    rules:
      - alert: RateLimiterRunningWithoutRedis
        expr: increase(ratelimiter_fallback_activated_total[10m]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiting has been running on the in-memory fallback for 15+ minutes"
          description: "FallbackRateLimiter could not reach Redis and has been limiting per-instance instead of globally for at least 15 minutes. Limits are effectively multiplied by the number of API instances, so the configured ceiling is not the one being enforced — brute-force protection on the auth endpoints is the part that matters. A brief blip during a Redis restart is expected and clears itself; a sustained rate means Redis is unreachable, so check its health endpoint first. Note this counter only moves when requests arrive, so silence here does not prove Redis is up."

      - alert: PostCommitCallbackFailing
        expr: increase(unitofwork_oncommitted_callback_failures_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A post-commit callback threw after its transaction had already committed"
          description: "The database write succeeded and something that was supposed to follow it did not, with no way to roll back. These callbacks carry side effects that the transaction deliberately does not cover: marking revoked sessions in Redis, refreshing a user's cached permission set, clearing applied events off an aggregate. Two of them matter. A failed session marking leaves the session revoked in the database while its access token keeps working until it expires on its own; a failed permission refresh leaves the previous set in the cache, so a change to someone's access silently does nothing until the entry expires. The exception is logged where it was swallowed; start there."

      - alert: CacheWritesNotLanding
        expr: increase(cache_operation_failures_total{operation="write"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Cache writes have been failing — stale values are being served"
          description: "A write that cannot reach Redis leaves whatever was already under the key, so this is not a cold cache: once Redis recovers it goes on serving the value the write was meant to replace, until the TTL expires. The permission set is the one that matters — a revoked permission keeps working for up to three minutes with nothing in the response to show for it. Reads failing at the same time are harmless by comparison and are tagged separately: those fall through to the database."

      - alert: CacheDeletesNotLanding
        expr: increase(cache_operation_failures_total{operation="delete"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Cache invalidation has been failing — stale entries remain until their TTL"
          description: "Entries that should have been dropped are still readable. Same consequence as a failed write, arriving from the projection side: the applier could not clear a permission set after a grant or a membership change. Correlate with cache_operation_failures_total{operation=\"write\"} — if both are moving, Redis is the problem rather than any one call site."

  - name: finance-tracker-auth
    rules:
      - alert: RefreshTokenReplayAllowanceSpiking
        expr: increase(refresh_token_replay_total{outcome="allowed"}[1h]) > 20
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Unusual number of refresh tokens replayed inside the grace window"
          description: "{{ $value }} replayed refresh tokens were answered with a replacement session in the last hour instead of triggering reuse detection. A trickle is normal: a client whose response was lost holds only the token it already sent, and retrying it is all it can do. A spike means either a client retrying when it should not, or someone timing replays to land inside the window. Lower Jwt__RefreshReplayGraceSeconds to narrow it, or set it to 0 to close the allowance entirely — the setting is a kill switch by design. Threshold is a guess until there is real traffic to calibrate against."

      - alert: RefreshTokenReuseDetected
        expr: increase(refresh_token_replay_total{outcome="reuse_detected"}[1h]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Refresh tokens are being replayed outside the grace window"
          description: "A revoked refresh token was presented and did not qualify as a retry, so every session for that user was revoked. One of these is unremarkable — a phone offline long enough for its token to go stale, an app restored from a backup. Several in an hour is a pattern worth reading. The alert cannot say whose tokens these are; the [Security] log entries carry the session and user ids. Repeated hits on one user point at a stolen token, spread across many at a leaked token store."

  - name: finance-tracker-backups
    rules:
      - alert: BackupNotRunning
        expr: time() - pg_backup_last_success_timestamp_seconds > 129600
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "No successful database backup in over 36 hours"
          description: "The nightly dump has missed at least one scheduled run. A backup job fails silently by nature — nothing else depends on it, so nothing else breaks to signal it. 36 hours rather than 24 so one restart or a slow run does not page anyone, while two consecutive misses do. Check the backup container's logs and the age of /backups/last-success."

      - alert: BackupMetricMissing
        expr: absent(pg_backup_last_success_timestamp_seconds)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "The backup has never reported a success"
          description: "No pg_backup_last_success_timestamp_seconds series exists at all, which BackupNotRunning cannot detect — a comparison against a missing series is never true, so a backup that has never once succeeded would alert on nothing. Either the job has not completed since this was deployed, or the textfile collector is not seeing /metrics."

      - alert: BackupShrinkingUnexpectedly
        expr: pg_backup_size_bytes < 0.5 * avg_over_time(pg_backup_size_bytes[7d])
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The latest dump is less than half its usual size"
          description: "A dump that completes and verifies can still be missing data — pg_dump against the wrong database, or a schema that lost tables. Size is a crude proxy but it is the one signal available without restoring. Expect a false positive after a large deletion; investigate rather than dismiss."

  - name: finance-tracker-database
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is unreachable"
          description: "Every application alert in this file is built on metrics the application emits itself, so none of them fire when the database is the thing that is down — the API simply stops producing numbers. This is the alert that speaks for that silence."

      - alert: PostgresConnectionsNearLimit
        expr: sum(pg_stat_activity_count) / on() pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Connection pool is above 80% of max_connections"
          description: "Twelve workers and an API share this pool, each with its own pool of connections. Exhausting it does not degrade gracefully: new connections are refused outright, and a worker that cannot connect looks identical to one whose job is failing. Check for a worker holding connections it is not using."

      - alert: LongRunningTransaction
        expr: max(pg_stat_activity_max_tx_duration{state="active"}) > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "A transaction has been open for more than 5 minutes"
          description: "Long transactions hold locks and block vacuum, so the cost lands on everything else rather than on the query itself. The base-currency rebuild is the known candidate — it walks a user's whole history in one transaction, which is acceptable in a worker where nothing waits on it. If this fires against the API instead, something has moved unbounded work back onto the request path."

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL detected a deadlock"
          description: "RetryBehaviour retries deadlocks, so a single one is handled and this alert is informational rather than urgent. What it is watching for is a pattern: repeated deadlocks mean two code paths take the same locks in opposite orders, and retrying only hides that."

      - alert: ReplicationSlotBloat
        expr: pg_replication_slots_pg_wal_lsn_diff > 1e9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A replication slot is holding back more than 1GB of WAL"
          description: "An inactive slot pins WAL indefinitely and fills the disk, which takes the database down entirely. Usually a slot left behind by something that no longer exists. Fires on nothing if no slots are in use."

  - name: finance-tracker-infrastructure
    rules:
      - alert: DiskFillingUp
        expr: node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% disk space remaining"
          description: "PostgreSQL stops accepting writes when it runs out of room, and recovering from a full disk is markedly harder than avoiding one. The usual causes here are the event store, which only grows, and accumulated dumps in the backups volume."

      - alert: DiskCritical
        expr: node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"} < 0.05
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Less than 5% disk space remaining"
          description: "Act now. Below this the database is close to refusing writes, and once it does, freeing space is complicated by the fact that PostgreSQL needs space to clean up."

      - alert: ContainerRestartLoop
        expr: increase(container_start_time_seconds[15m]) > 0 and changes(container_start_time_seconds[1h]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} has restarted repeatedly"
          description: "A container restarting on a loop can keep passing health checks between attempts, so nothing downstream notices. With restart: unless-stopped this is otherwise invisible."

      - alert: ContainerMemoryNearLimit
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.9 and container_spec_memory_limit_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} is above 90% of its memory limit"
          description: "The OOM killer terminates the process without a log entry from the application, so the failure looks like an unexplained restart. Fires on nothing for containers without a memory limit set."

  - name: finance-tracker-broker
    rules:
      - alert: RabbitMqDown
        expr: rabbitmq_identity_info == 0 or absent(rabbitmq_identity_info)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ is unreachable"
          description: "Publishing stops, so the outbox backs up rather than losing anything — that part is by design. Consumers reconnect on their own once the broker returns. What breaks meanwhile is that every projection stops updating, so balances and totals silently stop moving while the API keeps answering."

      - alert: QueueBacklogGrowing
        expr: rabbitmq_detailed_queue_messages_ready > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} has over 1000 messages waiting"
          description: "A consumer is slower than its producer, or is not consuming at all. The projections behind these queues are what account balances and category totals are read from, so a backlog here shows up to users as figures that stopped updating rather than as an error. Threshold is a guess until there is real traffic to calibrate against."

      - alert: DeadLetterQueueNotEmpty
        expr: rabbitmq_detailed_queue_messages_ready{queue=~".*\\.dlq"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }} holds dead-lettered messages"
          description: "Complements OutboxMessageDeadLettered, which watches the publish side. This watches the consume side: messages that exceeded x-delivery-limit and were routed to the per-queue DLX. DeadLetterAuditListener records each one in unresolvable_events with the full body, so start there rather than in the queue."

      - alert: NoConsumersOnQueue
        expr: rabbitmq_detailed_queue_consumers == 0 and rabbitmq_detailed_queue_messages_ready > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.queue }} has messages and no consumer"
          description: "The worker for this queue is down, or connected without subscribing. Distinct from a backlog: nothing is being processed at all, and nothing will be until someone looks. This is the failure the reconnect loop is meant to prevent, so it firing means the loop itself is stuck."
  - name: finance-tracker-health
    rules:
      - alert: HealthCheckFailing
        expr: healthcheck < 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.healthcheck }} is unhealthy on {{ $labels.instance }}"
          description: "The dependency behind this check has been failing for two minutes, which is past a restart or a brief network blip. Until now a red check only showed on a page someone had to open; this is the same information arriving on its own. 2 means healthy, 1 degraded, 0 unhealthy — anything below 2 is worth reading. /health/ready on the instance lists every check with its reason."

      - alert: HealthCheckSlow
        expr: healthcheck_duration_seconds > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.healthcheck }} is taking over a second to answer"
          description: "The check still passes, so nothing is broken yet — but a dependency that takes this long to say it is alive is usually about to stop saying it. Kubernetes and Docker health probes have their own timeouts, and a check slower than the probe interval makes an instance look dead while it is merely slow."

      - alert: HealthCheckMetricMissing
        expr: absent(healthcheck)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "No health check metrics are arriving at all"
          description: "HealthCheckFailing compares against a series that has to exist — with none, it is never true, so a total absence of health data looks exactly like everything being healthy. Either nothing is running, or the health-checks scrape job is broken."
